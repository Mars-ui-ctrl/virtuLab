    <path d="M 180 60 L 252 60 L 252 195 A 135 135 0 1 1 180 195 Z" fill="#E2E8F0" opacity="0.8" stroke="#CBD5E1" stroke-width="12" stroke-linejoin="round"/>
    
    <!-- Purple Liquid Base -->
    <path d="M 100 240 Q 216 220 332 240 C 332 305 280 355 216 355 C 152 355 100 305 100 240 Z" fill="#A855F7"/>
    
    <!-- Floating Liquid Bubbles -->
    <circle cx="170" cy="275" r="18" fill="#7E22CE"/>
    <circle cx="235" cy="295" r="12" fill="#7E22CE"/>
    <circle cx="230" cy="210" r="14" fill="#C084FC"/>
    <circle cx="195" cy="175" r="10" fill="#C084FC"/>
    <circle cx="240" cy="140" r="8" fill="#C084FC"/>

    <!-- Right Side Glass Highlight Crescent -->
    <path d="M 310 220 A 110 110 0 0 1 295 320" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" opacity="0.95"/>

    <!-- Top Grey Cap Stopper -->
    <rect x="168" y="42" width="96" height="32" rx="8" fill="#94A3B8"/>
